apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: reguard
servers: 1
agents: 0
image: rancher/k3s:v1.35.5-k3s1
kubeAPI:
  hostIP: 127.0.0.1
ports:
  - port: 127.0.0.1:13000:30080
    nodeFilters: [server:0]
options:
  kubeconfig:
    updateDefaultKubeconfig: false
    switchCurrentContext: false
  k3s:
    extraArgs:
      - arg: --disable=traefik
        nodeFilters: [server:0]
